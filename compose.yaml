services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ASCII_MOTION_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      # La red de entrada se declara primero.
      - edge
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true
